<!DOCTYPE html>

<head>

<link rel="stylesheet" href="css/compañia.css">

<link rel="stylesheet" href="css/asistencia.css">
<link rel="stylesheet" href="css/auditoria.css?v=20260813-3">
<link rel="stylesheet" href="css/auditoria-fix.css?v=20260813-3">
<link rel="stylesheet" href="css/dashboard.css?v=20260813-1">
<link rel="stylesheet" href="css/dashboard-interactivo.css?v=20260814-3">



<link rel="stylesheet" href="css/compañia/informacion.css">
<link rel="stylesheet" href="css/compañia/sucursales.css">
<link rel="stylesheet" href="css/compañia/areas.css">
<link rel="stylesheet" href="css/compañia/subareas.css">
<link rel="stylesheet" href="css/empleados /colaboradores.css">
<link rel="stylesheet" href="css/empleados /horarios.css?v=20260814-4">
<link rel="stylesheet" href="css/empleados /permisos.css">
<link rel="stylesheet" href="css/empleados /feriados.css">
<link rel="stylesheet" href="css/modulos-responsive.css?v=20260814-3">
<link rel="stylesheet" href="css/modulos-profesionales.css?v=20260814-3">
<link rel="stylesheet" href="css/configuracion.css?v=20260814-1">
<link rel="stylesheet" href="css/manual.css?v=20260814-1">


</head>


<body>

<div class="overlay"></div>
   

<div class="app">


    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="marca">

<div class="logo">
    <img src="img/logo.png" alt="Logo de Control de Asistencia">
</div>
            <div>
                <h2>
                    Control
                </h2>
                <span>
                    Asistencia
                </span>
            </div>
        </div>

        <nav class="menu">
            
            <button class="item activo" data-vista="dashboard">
                <span>
                    📊
                </span>
                Dashboard
            </button>
            
            <button class="item" data-vista="compañia">
                <span>
                    🏢
                </span> 
                Compañía 
            </button>

            <button class="item" data-vista="empleados">
                <span>
                    👥
                </span>
                Empleados
            </button>

            <button class="item" data-vista="asistencia">
                <span>
                    🕒
                </span>
                Asistencia
            </button>

            <button class="item" data-vista="auditoria">
                <span>
                    🛡️
                </span>
                Auditoría
            </button>

            <button class="item" data-vista="configuracion">
                <span>
                    ⚙️
                </span>
                Configuración
            </button>
            
        </nav>

        <button class="salir">
            🚪Cerrar sesión
        </button>
    </aside>






    <!-- CONTENIDO -->

<section class="contenido">

    <header class="topbar">

        <div class="topbar-izquierda">

            <button class="btn-menu">
                ☰
            </button>

            <h1>Dashboard</h1>

        </div>

<button type="button" class="btn-manual-global" id="btnManualGlobal" title="Abrir manual del sistema">
    <i class="bi bi-book"></i><span>Manual</span>
</button>

<div class="usuario" id="btnUsuario">

    <div class="usuario-avatar">
        👤
    </div>

    <div class="usuario-info">

        <span id="nombreUsuarioTop">
            Usuario
        </span>

        <small>
            Mi cuenta
        </small>

    </div>

    <span class="usuario-flecha">
        ▼
    </span>

</div>

<div
id="menuUsuario"
class="menu-usuario">

    <div class="menu-header">

        <div class="avatar-grande">
            👤
        </div>

        <h3 id="nombreUsuarioMenu">
            Usuario
        </h3>

        <p id="correoUsuarioMenu">
            correo@empresa.com
        </p>

        <span class="badge-rol">
            Administrador
        </span>

    </div>

    <div class="linea"></div>

<form id="formPassword">

    <div class="campo-menu">

        <label>Nombre</label>

        <input
        id="perfilNombre"
        type="text">

    </div>

    <div class="campo-menu">

        <label>Correo</label>

        <input
        id="perfilCorreo"
        type="email">

    </div>

<div class="campo-menu">

<label>Contraseña actual</label>

<input
    id="perfilPasswordActual"
    name="passwordActual"
    type="password"
    autocomplete="current-password"
    placeholder="••••••••">

</div>


<div class="campo-menu">

<label>Nueva contraseña</label>

<input
    id="perfilPassword"
    name="passwordNueva"
    type="password"
    autocomplete="new-password"
    placeholder="••••••••">


<div class="password-reglas">

    <div id="reglaLongitud" class="regla">
        Mínimo 8 caracteres
    </div>

    <div id="reglaMayuscula" class="regla">
        Una letra mayúscula
    </div>

    <div id="reglaMinuscula" class="regla">
        Una letra minúscula
    </div>

    <div id="reglaEspecial" class="regla">
        Un carácter especial (. ! @ # $ %)
    </div>

</div>


</div>
        <button type="button" id="guardarPerfil" class="btn-guardar-perfil">
        Guardar cambios
        </button>
</form>

</div>


 

    </header>

    
        <main id="contenedorVista">


            <!-- Aquí carga dashboard -->

        </main>



    </section>



</div>

<script type="module" src="js/inicio.js?v=20260814-7"></script>

</body>

</html>
